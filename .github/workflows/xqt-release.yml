# xournal-qt: the artifacts of a release. Push a tag "v1.2.3" (or start this by hand) and a draft release with the
# packages appears; look at it, write the notes and publish it. Linux (.deb, AppImage) is built here; Windows (a
# portable zip and the installer), Android (the APK, signed with the release key from the repository secrets) and
# macOS (an unsigned .dmg for Apple Silicon) by their own workflows, called from here.
#
# Qt 6.5 or newer is needed, which the runners' own Ubuntu 24.04 does not have (6.4), so every job builds in a
# container: the .debs on Debian 13 (Qt 6.8) and Ubuntu 26.04 (Qt 6.10), with the system's Qt; the AppImage on Ubuntu
# 22.04 with Qt from qt.io (qt/scripts/linux-qt.sh), which it carries with it. A .deb installs only on the system it
# was built on: it depends on that system's exact Qt version (the QML compiled ahead of time uses Qt's private API, so
# dpkg-shlibdeps adds qt6-*-private-abi (= <version>)) and on its library package names (Debian's libjpeg62-turbo and
# libxml2 are Ubuntu 26.04's libjpeg-turbo8 and libxml2-16).
name: xournal-qt release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            container: debian:trixie
            suffix: debian13
          - name: Ubuntu 26.04
            container: ubuntu:26.04
            suffix: ubuntu26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
    steps:
      - name: What the checkout needs in the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates ccache

      - uses: actions/checkout@v4

      - name: Install the build dependencies
        run: bash qt/scripts/linux-deps.sh

      # (a second release run of the same version, after a fix, rebuilds only what changed)
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: xqt-release-ccache-${{ matrix.suffix }}-${{ github.sha }}
          restore-keys: xqt-release-ccache-${{ matrix.suffix }}-

      - name: The tag and the version of the project must say the same
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^project(xournal-qt VERSION \([0-9.]*\).*/\1/p' qt/CMakeLists.txt)"
          tag="${GITHUB_REF_NAME#v}"
          echo "project ${version}, tag ${tag}"
          [ "$version" = "$tag" ] || { echo "::error::the tag says ${tag}, qt/CMakeLists.txt says ${version}"; exit 1; }

      - name: Configure
        run: cmake -S qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXQT_BUILD_SPIKES=OFF

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        # (a UI test that fails runs up to twice more: the runners are slower and busier than a desktop, and some
        # UI tests still wait fixed times; each one that needed a repeat is listed in the log. TODO.md: harden them)
        run: ctest --test-dir build -j "$(nproc)" --output-on-failure --timeout 300 --repeat until-pass:3

      # The handwriting search: ONNX Runtime goes into the package beside what `cmake --install` puts there (the
      # models, share/xournal-qt/hwr-models/). CPack adds the staged folder to /usr.
      - name: Make the package (with ONNX Runtime)
        run: |
          stage="$PWD/ort-stage"
          bash qt/scripts/linux-onnxruntime.sh "$stage"
          cd build
          cpack -G DEB -D "CPACK_INSTALLED_DIRECTORIES=$stage;."
          cd packages
          for f in *.deb; do mv "$f" "${f%.deb}_${{ matrix.suffix }}.deb"; done
          ls -l
          dpkg-deb -c ./*.deb | grep -E 'onnxruntime|hwr-models' || true

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.suffix }}
          path: build/packages/*.deb
          if-no-files-found: error

      # Installed as a user would, then asked whether handwriting can be read (exit code 1 when ONNX Runtime or a model
      # is missing, or the sample is not read): qt/docs/development/releasing.md, "Handwriting"
      - name: Smoke test of the package (handwriting)
        run: |
          apt-get install -y --no-install-recommends ./build/packages/*.deb
          bash qt/scripts/hwr-package-check.sh models /usr/share/xournal-qt
          test -e /usr/lib/xournal-qt/libonnxruntime.so.1
          QT_QPA_PLATFORM=offscreen xournal-qt --hwr-info

  appimage:
    name: Ubuntu 22.04 (Qt from qt.io), AppImage
    runs-on: ubuntu-latest
    # Ubuntu 22.04: the AppImage runs on the systems with this glibc or a newer one. Its Qt (6.2) is too old, so Qt
    # comes from qt.io (qt/scripts/linux-qt.sh) and goes into the AppImage.
    container: ubuntu:22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
      XQT_QT_VERSION: 6.11.2
      QT_PREFIX: /opt/qt/6.11.2/gcc_64
    steps:
      - name: What the checkout needs in the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates ccache

      - uses: actions/checkout@v4

      - name: Install the build dependencies (without the system's Qt)
        run: bash qt/scripts/linux-deps.sh
        env:
          XQT_QT_DOWNLOAD: '1'

      - name: Qt cache
        uses: actions/cache@v4
        with:
          path: /opt/qt
          key: xqt-linux-qt-${{ env.XQT_QT_VERSION }}-${{ hashFiles('qt/scripts/linux-qt.sh') }}

      - name: Qt from qt.io and KSyntaxHighlighting
        run: |
          bash qt/scripts/linux-qt.sh /opt/qt
          # (its CMake: Ubuntu 22.04's is too old for KDE's CMake files; the app is built with the same one)
          echo /opt/qt/tools/bin >> "$GITHUB_PATH"

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: xqt-release-ccache-jammy-qtio-${{ github.sha }}
          restore-keys: xqt-release-ccache-jammy-qtio-

      - name: The tag and the version of the project must say the same
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^project(xournal-qt VERSION \([0-9.]*\).*/\1/p' qt/CMakeLists.txt)"
          tag="${GITHUB_REF_NAME#v}"
          echo "project ${version}, tag ${tag}"
          [ "$version" = "$tag" ] || { echo "::error::the tag says ${tag}, qt/CMakeLists.txt says ${version}"; exit 1; }

      - name: Configure
        run: |
          cmake -S qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXQT_BUILD_SPIKES=OFF \
                -DCMAKE_PREFIX_PATH="$QT_PREFIX" -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        # (as in the packages above)
        run: ctest --test-dir build -j "$(nproc)" --output-on-failure --timeout 300 --repeat until-pass:3

      - name: Install into an AppDir
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          # The handwriting search: ONNX Runtime beside the program (usr/lib/xournal-qt; the models came with the install)
          bash qt/scripts/linux-onnxruntime.sh "$PWD/AppDir/usr"

      - name: Pack it
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1  # the runners have no FUSE
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          plugin=https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous
          curl -fsSLO "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSLO "$plugin/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QML_SOURCES_PATHS="$PWD/qt/src/app/qml"
          export QMAKE="$QT_PREFIX/bin/qmake"  # how the Qt plugin finds Qt
          # (the installed program has no rpath into Qt's folder: this is how linuxdeploy finds Qt's libraries and
          # KSyntaxHighlighting)
          export LD_LIBRARY_PATH="$QT_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          version="$(sed -n 's/^project(xournal-qt VERSION \([0-9.]*\).*/\1/p' qt/CMakeLists.txt)"
          case "$GITHUB_REF_NAME" in v*) export VERSION="${GITHUB_REF_NAME#v}" ;; *) export VERSION="$version" ;; esac
          export OUTPUT="xournal-qt-$VERSION-x86_64.AppImage"  # else it is named after the desktop entry
          # (the off-screen platform as well, for scripted runs such as the smoke test below; a few hundred KB)
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
              -d AppDir/usr/share/applications/xournal-qt.desktop \
              -i AppDir/usr/share/icons/hicolor/scalable/apps/xournal-qt.svg
          # Only what was built, never the two tools of linuxdeploy (they are AppImages themselves)
          mkdir -p out
          if [ -f "$OUTPUT" ]; then
              mv "$OUTPUT" out/
          else
              for f in *.AppImage; do
                  case "$f" in linuxdeploy*) ;; *) mv "$f" "out/$OUTPUT" ;; esac
              done
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: package-appimage
          path: out/*.AppImage
          if-no-files-found: error

      # The AppImage as a user starts it, asked whether handwriting can be read (exit code 1 when ONNX Runtime or a
      # model is missing, or the sample is not read): qt/docs/development/releasing.md, "Handwriting"
      - name: Smoke test of the AppImage (handwriting)
        run: |
          bash qt/scripts/hwr-package-check.sh models AppDir/usr/share/xournal-qt
          export APPIMAGE_EXTRACT_AND_RUN=1  # the runners have no FUSE
          QT_QPA_PLATFORM=offscreen out/*.AppImage --hwr-info

  windows:
    name: Windows
    uses: ./.github/workflows/xqt-windows.yml

  android:
    name: Android
    uses: ./.github/workflows/xqt-android.yml
    secrets: inherit

  macos:
    name: macOS
    uses: ./.github/workflows/xqt-macos.yml

  draft:
    name: Draft release
    needs: [packages, appimage, windows, android, macos]
    # Also when one of them did not manage: what was packaged still goes into the draft.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: xournal-qt-windows-x64
          path: windows
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: xournal-qt-windows-setup-x64
          path: windows-setup
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: xournal-qt-android-arm64
          path: android
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: xournal-qt-macos-*
          merge-multiple: true
          path: macos

      - name: Write the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/^project(xournal-qt VERSION \([0-9.]*\).*/\1/p' qt/CMakeLists.txt)"
          mkdir -p artifacts
          # Windows: the portable folder as one zip; Android: the APK, named after the version
          if [ -n "$(ls -A windows 2>/dev/null)" ]; then
              (cd windows && zip -qr "../artifacts/xournal-qt-${version}-windows-x64.zip" .)
          fi
          # Windows: the installer, named with the version already
          cp windows-setup/xournal-qt-*-windows-setup-x64.exe artifacts/ 2>/dev/null || true
          if [ -f android/xournal-qt-arm64.apk ]; then
              cp android/xournal-qt-arm64.apk "artifacts/xournal-qt-${version}-android-arm64.apk"
          fi
          # macOS: the disk images as they are (named with the version and the architecture)
          cp macos/*.dmg artifacts/ 2>/dev/null || true
          ls -l artifacts || true
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
              echo "::error::nothing was packaged - look at the jobs above"
              exit 1
          fi
          version="$(sed -n 's/^project(xournal-qt VERSION \([0-9.]*\).*/\1/p' qt/CMakeLists.txt)"
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v${version}" ;; esac   # started by hand: the version of the project
          notes="qt/docs/release-notes/${tag#v}.md"
          if [ -f "$notes" ]; then
              gh release create "$tag" --draft --target "$GITHUB_SHA" --title "xournal-qt $tag" --notes-file "$notes" artifacts/* \
                  || { gh release upload "$tag" artifacts/* --clobber && gh release edit "$tag" --target "$GITHUB_SHA"; }
          else
              gh release create "$tag" --draft --target "$GITHUB_SHA" --title "xournal-qt $tag" --generate-notes artifacts/* \
                  || { gh release upload "$tag" artifacts/* --clobber && gh release edit "$tag" --target "$GITHUB_SHA"; }
          fi
