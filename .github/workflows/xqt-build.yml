# xournal-qt (the Qt 6 frontend of this fork): build it and run its tests.
# The fork's work lives on "master-qt"; "master" follows upstream Xournal++ so that upstream can be merged and this
# stays a normal fork. The upstream GTK workflows in this folder only run for pull requests to "master" and in the upstream
# repository, so they stay out of the way here.
name: xournal-qt

on:
  push:
    branches: [master-qt]
    paths:
      - 'qt/**'
      - 'src/**'
      - 'test/**'
      - 'cmake/**'
      - '.github/workflows/xqt-build.yml'
  pull_request:
    branches: [master-qt]
  workflow_dispatch:

concurrency:
  group: xournal-qt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Debian 13 (Qt 6.8)
    runs-on: ubuntu-latest
    # Qt 6.5 or newer is needed: Ubuntu 24.04 (the runner's own system) has 6.4, Debian 13 has 6.8.
    container: debian:trixie
    steps:
      - name: What the checkout needs in the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install the build dependencies
        run: bash qt/scripts/linux-deps.sh

      - name: Configure
        run: cmake -S qt -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DXQT_BUILD_SPIKES=OFF

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        # The tests run off-screen and in their own configuration and cache folders (see their main.cpp).
        run: ctest --test-dir build -j "$(nproc)" --output-on-failure --timeout 300

      - name: Validate archive PDFs with veraPDF
        # Archive PDFs (qt/docs/hybrid-pdf.md, "Archive PDF") must be PDF/A-3b. veraPDF, the reference validator, is a
        # test tool only: the app never runs it. The tests write their archive PDFs that claim PDF/A into a folder
        # (also one saved incrementally three times, qt/pdf-incremental).
        env:
          VERAPDF_VERSION: 1.28.2
          VERAPDF_SHA1: 7484fd844c7f2fc5c7f554f25511e2a1b2a7dc00
        run: |
          apt-get install -y --no-install-recommends default-jre-headless curl
          jar="greenfield-apps-$VERAPDF_VERSION.jar"
          curl -fsSL -o "$jar" "https://repo1.maven.org/maven2/org/verapdf/apps/greenfield-apps/$VERAPDF_VERSION/$jar"
          echo "$VERAPDF_SHA1  $jar" | sha1sum -c -
          QT_QPA_PLATFORM=offscreen XQT_ARCHIVE_SAMPLES="$PWD/archive-samples" \
            build/xqt-session-tests --gtest_filter='ArchivePdfTest.*:IncrementalSaveTest.anArchivePdfStaysPdfA*'
          ls archive-samples
          java -cp "$jar" org.verapdf.apps.GreenfieldCliWrapper --flavour 3b --format text -v archive-samples/*.pdf \
            | tee verapdf.txt
          if grep -q '^FAIL' verapdf.txt || ! grep -q '^PASS' verapdf.txt; then
            echo "veraPDF: an archive PDF is not PDF/A-3b"; exit 1
          fi

      - name: Keep the test output of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            build/Testing/**
            build/**/*.log
            verapdf.txt
            archive-samples/**
          if-no-files-found: ignore
