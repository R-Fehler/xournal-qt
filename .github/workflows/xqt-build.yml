# xournal-qt (the Qt 6 frontend of this fork): build it and run its tests.
# The fork's work lives on "master-qt"; "master" follows upstream Xournal++ so that upstream can be merged and this
# stays a normal fork. The upstream GTK workflows in this folder only run for pull requests to "master" and in the upstream
# repository, so they stay out of the way here.
name: xournal-qt

on:
  push:
    # (also the integration branches of the cloud sessions, so a failure on Qt 6.7 or 6.8 shows up while the work
    # goes on, not when a release is cut)
    branches: [master-qt, 'claude/**']
    paths:
      - 'qt/**'
      - 'src/**'
      - 'test/**'
      - 'cmake/**'
      - '.github/workflows/xqt-build.yml'
  pull_request:
    branches: [master-qt]
  workflow_dispatch:

concurrency:
  group: xournal-qt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every relative link in the fork's Markdown resolves, and every qt/docs/... path cited in code exists
      - name: Check the doc links
        run: python3 qt/scripts/check-doc-links.py

  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Qt 6.5 or newer is needed: Ubuntu 24.04 (the runner's own system) has 6.4. Both Qt versions the release packages
    # are built with: Debian 13 (Qt 6.8) and Ubuntu 22.04 with KDE neon's packages (Qt 6.7).
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 (Qt 6.8)
            container: debian:trixie
            neon: '0'
            key: debian13
          - name: KDE neon / Ubuntu 22.04 (Qt 6.7)
            container: ubuntu:22.04
            neon: '1'
            key: neon-jammy
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
    steps:
      - name: What the checkout needs in the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates ccache

      - uses: actions/checkout@v4

      - name: Install the build dependencies
        run: bash qt/scripts/linux-deps.sh
        env:
          XQT_NEON: ${{ matrix.neon }}

      # The compiler cache of the last run of this container (CMake uses ccache when it is installed): a build that
      # changed a few files takes minutes instead of a quarter of an hour
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: xqt-ccache-${{ matrix.key }}-${{ github.sha }}
          restore-keys: xqt-ccache-${{ matrix.key }}-

      - name: Configure
        run: cmake -S qt -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DXQT_BUILD_SPIKES=OFF

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        # The tests run off-screen and in their own configuration and cache folders (see their main.cpp).
        # (a UI test that fails runs up to twice more: the runners are slower and busier than a desktop, and some
        # UI tests still wait fixed times; each one that needed a repeat is listed in the log. TODO.md: harden them)
        run: ctest --test-dir build -j "$(nproc)" --output-on-failure --timeout 300 --repeat until-pass:3

      - name: Validate archive PDFs with veraPDF
        if: matrix.neon == '0'
        # Archive PDFs (qt/docs/features/hybrid-pdf.md, "Archive PDF") must be PDF/A-3b. veraPDF, the reference
        # validator, is a test tool only: the app never runs it. The tests write their archive PDFs that claim PDF/A
        # into a folder (also one saved incrementally three times, qt/pdf-incremental).
        env:
          VERAPDF_VERSION: 1.28.2
          VERAPDF_SHA1: 7484fd844c7f2fc5c7f554f25511e2a1b2a7dc00
        run: |
          apt-get install -y --no-install-recommends default-jre-headless curl
          jar="greenfield-apps-$VERAPDF_VERSION.jar"
          curl -fsSL -o "$jar" "https://repo1.maven.org/maven2/org/verapdf/apps/greenfield-apps/$VERAPDF_VERSION/$jar"
          echo "$VERAPDF_SHA1  $jar" | sha1sum -c -
          QT_QPA_PLATFORM=offscreen XQT_ARCHIVE_SAMPLES="$PWD/archive-samples" \
            build/xqt-session-tests --gtest_filter='ArchivePdfTest.*:IncrementalSaveTest.anArchivePdfStaysPdfA*'
          ls archive-samples
          java -cp "$jar" org.verapdf.apps.GreenfieldCliWrapper --flavour 3b --format text -v archive-samples/*.pdf \
            | tee verapdf.txt
          if grep -q '^FAIL' verapdf.txt || ! grep -q '^PASS' verapdf.txt; then
            echo "veraPDF: an archive PDF is not PDF/A-3b"; exit 1
          fi

      - name: Keep the test output of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.key }}
          path: |
            build/Testing/**
            build/**/*.log
            verapdf.txt
            archive-samples/**
          if-no-files-found: ignore
