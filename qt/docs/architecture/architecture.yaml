    paths: [src/core/control/xojfile/]
    responsibility: >-
      Xournal++'s documents (gzipped XML). Both programs read and write them; the fork's attributes (xqt-group,
      xqt-created, xqt-bookmark, xqt-fill-color, notespace) are ones Xournal++ ignores.
    key:
      - name: SaveHandler.cpp
        path: src/core/control/xojfile/SaveHandler.cpp
        what: what a file holds
      - name: test/files/
        path: test/files/
        what: upstream's sample files
    docs: [qt/docs/decisions/0002-upstream-seams.md, qt/docs/features/groups.md]
  - id: data-settings
    name: settings.xml
    layer: data
    kind: data
    label: upstream's format, own folder
    paths: [src/core/control/settings/Settings.cpp]
    responsibility: >-
      Upstream's settings file, in a config folder of the fork's own (~/.config/xournal-qt); the fork's keys live in
      its custom part `xournalQt`.
    key:
      - name: Settings.cpp
        path: src/core/control/settings/Settings.cpp
        what: reads and writes the file
      - name: SettingsModel.cpp
        path: qt/src/shell/SettingsModel.cpp
        what: the keys the settings page shows

