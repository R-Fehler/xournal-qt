# The architecture of xournal-qt: the single source of the overview.
#
# qt/scripts/architecture/generate.py reads this file and writes, next to it, architecture.svg (the diagram),
# README.md (the overview) and site/index.html (the interactive page for GitHub Pages). Do not edit those three:
# edit this file and run `python3 qt/scripts/architecture/generate.py`. CI runs it with --check: the generated files
# are up to date, every path below exists, and every CMake link between the targets named here is an edge.
#
# A block that adds or moves a module, a target or a key class updates this file in the same commit.
#
# The format is a small subset of YAML (the generator uses Python's standard library only): mappings, lists, plain or
# double-quoted scalars on one line, and folded scalars (`>-`) for longer text. A plain scalar must not contain ": " or
# " #" and must not start with a backtick: quote it, or use `>-`. Paths are relative to the repository root; a path
# ending in "/" is a folder.
#
#   layers:  the rows of the diagram, top to bottom (`side: right` is the column at the right)
#   blocks:  id, name, layer, kind, label (the caption in the diagram), target (the CMake target), paths,
#            responsibility (one line), key (the key classes or files: name, path, what), docs, w (relative width)
#   edges:   from, to, kind, what (why: the README and the page show it), hide: true (not drawn in the static SVG)
#   kinds of edges:
#     links    a CMake target links another (what the build enforces)
#     calls    direct use: includes and calls (an upstream class used unmodified counts here)
#     shadows  through qt/compat: upstream code calls a shadow header, a fork class implements one, or a shadow
#              stands in for a GTK class
#     seam     a hook or an edit in an upstream file, marked `xournal-qt:` (ADR 0002)
#     data     reads or writes shared files (.xopp/.xoj, settings.xml, PDFs, caches)
#     qml      QML talks to C++: the context property `app`, registered types, image providers, list models
#   flows:   paths through the code, step by step (block and file)
#   tasks:   "where to change what": a task, the fork's files, upstream's files

github: https://github.com/R-Fehler/xournal-qt
branch: master-qt
pages: https://r-fehler.github.io/xournal-qt/

intro: >-
  xournal-qt is a fork of Xournal++: upstream's C++ core in `src/` (the document model, the .xopp/.xoj files,
  undo, the tools, the cairo renderers, PDF through poppler), compiled without GTK, under a new Qt 6 / Qt Quick
  frontend in `qt/`. Dependencies point down: the QML UI talks to the app's C++, which uses the shell, the canvas and
  the headless document session, which build on the Xournal++ core. Between the two sits `qt/compat`: headers with
  upstream's names that stand in for the GTK classes upstream's code expects.

  Each block below is a folder or a set of files with one job; most are one CMake target. Every edge says why it is
  there. The diagram shows the main edges; the tables and the interactive page show all of them.

core_usage: >-
  The fork reaches upstream's code in four ways, in this order of preference. It calls it directly: the model, the
  loader and saver, undo, the views and the PDF code are compiled unmodified into `xoj-util`, `xoj-core` and
  `xoj-tools`, from the explicit list in `qt/cmake/XojSources.cmake` (no globbing: an upstream merge never pulls GTK
  code in unnoticed). Where upstream's code expects its GTK application objects (`Control`, `XojPageView`, `Layout`,
  …), the shadow headers of `qt/compat` take their place, and fork classes implement them. Where a frontend needs to
  change what upstream does, a small hook or edit in an upstream file (a seam, marked `xournal-qt:`) lets it, and
  ADR 0002 lists every one. And where upstream's class is GTK-bound through and through, the fork ported it
  (`PageRaster` from `RenderJob`, `CanvasPage` from `XojPageView`, `CanvasInput` from the input handlers).

layers:
  - id: ui
    name: Qt Quick UI (QML)
    about: >-
      The whole user interface, in QML: one window per `Main.qml`, its parts each in a file of its own. QML talks to
      C++ only through the context properties `app` (an AppController) and `win`, the types registered under
      `XournalQt.Canvas`, the image providers and the list models.
  - id: app
    name: App (C++ behind the UI)
    about: >-
      What the windows of the process share (AppServices), one window's QML API (AppController) and the program's
      start (main.cpp). Compiled into `xqt-shell` (the C++) and `xournal-qt` (main.cpp).
  - id: shell
    name: Shell (library, tabs, models)
    about: >-
      Everything between the documents and the QML that is not a canvas: the library, the tabs, what acts on a
      canvas, the image providers and their caches, the list and settings models. One target, `xqt-shell`.
  - id: view
    name: Canvas and views
    about: >-
      A document shown in a view (canvas), the view in the Qt Quick scene graph (quick), and handwriting search
      (hwr), which reads the ink of the sessions.
  - id: document
    name: Documents, headless
    about: >-
      One open document without a view (session), and what it builds on: the Markdown engine, recordings, and the
      Qt-free render workers. The CLI and the tests use these without a window.
  - id: compat
    name: qt/compat (the GTK stand-ins)
    about: >-
      Headers with upstream's names placed before upstream's include paths, so upstream's files compile without GTK
      and without edits: shadows of the GTK application classes (implemented by the fork), a GTK type shim, and
      GTK-free implementations of a few upstream files.
  - id: core
    name: Xournal++ core (src/, upstream)
    about: >-
      Upstream Xournal++'s C++ core, compiled unmodified (apart from the seams of ADR 0002) from the explicit list in
      `qt/cmake/XojSources.cmake` into three static libraries: `xoj-util`, `xoj-core` and `xoj-tools`. Upstream's
      GTK GUI is not built.
  - id: around
    name: Around the app
    about: >-
      The headless CLI, the tests, the developer tools, the vendored libraries, the platform layers and CI.
  - id: data
    name: Shared data
    side: right
    about: >-
      The files both programs read and write. A document written by xournal-qt opens in Xournal++ and the other way
      round; the fork's own attributes are ones Xournal++ ignores.

blocks:
  # --- Qt Quick UI ---------------------------------------------------------------------------------------------------
  - id: qml-window
    name: Window
    layer: ui
    kind: qml
    label: Main.qml and its state
    target: xqt-ui
    paths: [qt/src/app/qml/]
    responsibility: >-
      The window (`win`): its state objects (insets, view modes, chrome layout), its keys with the one ordered
      Esc/Back dispatcher, and the parts it instantiates.
    key:
      - name: Main.qml
        path: qt/src/app/qml/Main.qml
        what: the window; holds the state objects and instantiates the parts
      - name: WindowInsets.qml, ViewModes.qml, ChromeLayout.qml
        path: qt/src/app/qml/ViewModes.qml
        what: "safe areas and keyboard (win.insets), full screen, Zen, read only, presenting (win.modes), where the chrome goes (win.layout)"
      - name: WindowActions.qml
        path: qt/src/app/qml/WindowActions.qml
        what: "what the parts ask the window to do (win.actions): look-ups, pages as files, the dialogs app asks for"
      - name: WindowShortcuts.qml, PageKeys.qml
        path: qt/src/app/qml/WindowShortcuts.qml
        what: the window's shortcuts and the ordered Esc/Back dispatcher
      - name: SaveFlow.qml, StartupFlow.qml, ExportFlow.qml
        path: qt/src/app/qml/SaveFlow.qml
        what: multi-step flows (save as, the first start, export)
    docs: [qt/src/app/README.md, qt/docs/features/zen.md, qt/docs/features/adaptive-layout.md]
  - id: qml-canvas
    name: Canvas chrome
    layer: ui
    kind: qml
    label: toolbox, tabs, pills, sidebar
    target: xqt-ui
    paths: [qt/src/app/qml/]
    responsibility: >-
      What surrounds the canvas: the tab strip, the toolbox and top bar, the pills over the page (selection, note,
      view), the page sidebar and the page area that hosts the `DocumentCanvas` item.
    key:
      - name: PageArea.qml
        path: qt/src/app/qml/PageArea.qml
        what: the canvas area of a tab
      - name: Toolbox.qml, ToolboxMenus.qml, AppButtons.qml
        path: qt/src/app/qml/Toolbox.qml
        what: the user's pens and tools, the top bar's buttons
      - name: TabStrip.qml
        path: qt/src/app/qml/TabStrip.qml
        what: the tabs
      - name: SelectionPill.qml, NotePill.qml, ViewPill.qml
        path: qt/src/app/qml/SelectionPill.qml
        what: the pills over the page; they act on a CanvasActions (app.edit)
      - name: PageSidebar.qml, PageGrid.qml
        path: qt/src/app/qml/PageSidebar.qml
        what: page previews (image://thumbnail, image://sketch)
      - name: ReferenceSplit.qml
        path: qt/src/app/qml/ReferenceSplit.qml
        what: a second document beside the first (the reference view)
    docs: [qt/docs/features/toolbox.md, qt/docs/features/reference-view.md]
  - id: qml-home
    name: Home and library
    layer: ui
    kind: qml
    label: HomeView and its parts
    target: xqt-ui
    paths: [qt/src/app/qml/]
    responsibility: >-
      The home screen: the library grid, recent files, bookmarks, to-dos and tags, the library's search and its file
      operations.
    key:
      - name: HomeView.qml
        path: qt/src/app/qml/HomeView.qml
        what: the home screen; instantiates its parts once each
      - name: DocumentGrid.qml, DocumentCard.qml
        path: qt/src/app/qml/DocumentGrid.qml
        what: the library's and Recent's grid (LibraryGridPage, RecentGridPage) and a document's card (image://cover)
      - name: BookmarksView.qml, TodosView.qml, TagsView.qml
        path: qt/src/app/qml/TodosView.qml
        what: the library's bookmarks, to-dos and tags
    docs: [qt/docs/features/library.md]
  - id: qml-settings
    name: Settings
    layer: ui
    kind: qml
    label: SettingsPage, Settings*.qml
    target: xqt-ui
    paths: [qt/src/app/qml/]
    responsibility: >-
      The settings page: one section per file (pen, touch, documents, display, search, storage, shortcuts, help) and
      the row types they are built of.
    key:
      - name: SettingsPage.qml
        path: qt/src/app/qml/SettingsPage.qml
        what: the page and its navigation
      - name: SettingsPen.qml, SettingsDocuments.qml, …
        path: qt/src/app/qml/SettingsPen.qml
        what: the sections; they read and write SettingsModel
      - name: SettingsSwitchRow.qml, SettingsSliderRow.qml
        path: qt/src/app/qml/SettingsSwitchRow.qml
        what: the row types
  - id: qml-dialogs
    name: Dialogs and sheets
    layer: ui
    kind: qml
    label: adaptive dialogs, menus
    target: xqt-ui
    paths: [qt/src/app/qml/]
    responsibility: >-
      Dialogs, menus and sheets that adapt from a desktop window to a phone (a dialog on a desktop, a sheet from the
      bottom on a phone), and the dialogs built on them.
    key:
      - name: AdaptiveDialog.qml
        path: qt/src/app/qml/AdaptiveDialog.qml
        what: a dialog or a bottom sheet, by the window's size class
      - name: AdaptiveMenu.qml, MenuSheet.qml
        path: qt/src/app/qml/AdaptiveMenu.qml
        what: a menu or a sheet
      - name: NewDocumentDialog.qml, BackgroundDialog.qml, PrintDialog.qml
        path: qt/src/app/qml/NewDocumentDialog.qml
        what: examples of the dialogs built on them
      - name: Popups.js
        path: qt/src/app/qml/Popups.js
        what: helpers for popups
    docs: [qt/docs/features/adaptive-layout.md]

  # --- App ----------------------------------------------------------------------------------------------------------
  - id: app-main
    name: main and EngineSetup
    layer: app
    kind: app
    label: start, engine, window
    target: xournal-qt
    paths: [qt/src/app/main.cpp, qt/src/app/EngineSetup.cpp]
    responsibility: >-
      Starts the program: the platform's setup, the AppServices, the QML engine with its image providers and the
      context property `app`, then the main window from the QML module `XournalQt`.
    key:
      - name: main.cpp
        path: qt/src/app/main.cpp
        what: the program's start (target xournal-qt)
      - name: EngineSetup
        path: qt/src/app/EngineSetup.h
        what: the engine as the app and the UI tests set it up (image providers, `app`)
    docs: [qt/src/app/README.md]
  - id: app-services
    name: AppServices
    layer: app
    kind: app
    label: what the windows share
    target: xqt-shell
    paths: [qt/src/app/AppServices.h, qt/src/app/OpenDocuments.h, qt/src/app/BackgroundJobs.h]
    responsibility: >-
      One per process: owns AppContext, the library and its lists, the toolbox, shortcuts, handwriting search, the
      window factory, the open documents of every window and the background jobs quitting waits for.
    key:
      - name: AppServices
        path: qt/src/app/AppServices.h
        what: the process-wide objects and the window factory
      - name: OpenDocuments
        path: qt/src/app/OpenDocuments.h
        what: "the windows; \"this file, wherever it is open\""
      - name: BackgroundJobs
        path: qt/src/app/BackgroundJobs.h
        what: the app's work off the UI thread, awaited at shutdown
    docs: [qt/docs/decisions/0003-app-services.md]
  - id: app-controller
    name: AppController
    layer: app
    kind: app
    label: one window's QML API `app`
    target: xqt-shell
    paths: [qt/src/app/AppController.h, qt/src/app/AppController.cpp]
    responsibility: >-
      One window's QML API, the context property `app`: its tabs, the current document's properties and every
      action the UI offers; the `App*.cpp` files beside it hold one area each.
    w: 1.3
    key:
      - name: AppController
        path: qt/src/app/AppController.h
        what: the QML API of one window
      - name: App*.cpp
        path: qt/src/app/AppBookmarks.cpp
        what: "one area each: bookmarks, tags, templates, stickers, snip, text files, …"
      - name: AudioControl
        path: qt/src/app/AudioControl.h
        what: recording and playing (app.audio)
      - name: TimelineControl
        path: qt/src/app/TimelineControl.h
        what: the replay of how a page was written (app.timeline)
      - name: WindowContext
        path: qt/src/app/WindowContext.h
        what: what a window's feature objects get from it (services, tabs, current document)
    docs: [qt/src/app/README.md, qt/docs/review/2026-10/app-cpp.md]
  - id: current-document
    name: CurrentDocument
    layer: app
    kind: app
    label: the current tab, relayed
    target: xqt-shell
    paths: [qt/src/app/CurrentDocument.h]
    responsibility: >-
      The current tab's DocumentSession and CanvasView with their signals relayed in one place; a window follows a
      tab change with one call.
    key:
      - name: CurrentDocument
        path: qt/src/app/CurrentDocument.h
        what: follow() on a tab change, announce() once set up
    docs: [qt/docs/decisions/0003-app-services.md]

  # --- Shell --------------------------------------------------------------------------------------------------------
  - id: shell-window
    name: Tabs and canvas actions
    layer: shell
    kind: qt
    label: TabManager, CanvasActions
    target: xqt-shell
    paths: [qt/src/shell/]
    responsibility: >-
      The window's controllers: the tabs (each owns its session and view), what acts on one canvas, the reference
      view, version comparison, the presenter console, recovery after a crash.
    key:
      - name: TabManager
        path: qt/src/shell/TabManager.h
        what: owns each tab's DocumentSession and CanvasView
      - name: CanvasActions
        path: qt/src/shell/CanvasActions.h
        what: "what acts on one canvas (app.edit, app.reference.edit)"
      - name: ReferenceMode
        path: qt/src/shell/ReferenceMode.h
        what: a second document beside the first
      - name: SessionRecovery
        path: qt/src/shell/SessionRecovery.h
        what: emergency saves and the recovery offer (port of upstream's CrashHandler)
      - name: PresenterConsole
        path: qt/src/shell/PresenterConsole.h
        what: the presenter's view and the audience window
    docs: [qt/src/shell/README.md, qt/docs/decisions/0003-app-services.md, qt/docs/features/presenter-view.md]
  - id: shell-library
    name: Library
    layer: shell
    kind: qt
    label: folder, index, search
    target: xqt-shell
    paths: [qt/src/shell/]
    responsibility: >-
      The library: a plain folder of documents, its index of every document's text and notes, its search, file
      operations, sharing and archives, and the list models of the home screen.
    key:
      - name: Library
        path: qt/src/shell/Library.h
        what: the folder, its documents, file operations
      - name: LibraryIndex
        path: qt/src/shell/LibraryIndex.h
        what: the text and notes of every document, and the search
      - name: LibraryModel
        path: qt/src/shell/LibraryModel.h
        what: the grid and its file operations (QML list model)
      - name: RecentFiles, LibraryBookmarks, LibraryTodos, LibraryTags
        path: qt/src/shell/RecentFiles.h
        what: the home screen's other lists
      - name: LibraryInkJob
        path: qt/src/shell/LibraryInkJob.h
        what: reads the handwriting of the library's documents
    docs: [qt/docs/features/library.md, qt/docs/features/tags.md, qt/docs/features/todos.md]
  - id: shell-images
    name: Pictures and caches
    layer: shell
    kind: qt
    label: image providers, ImageMemory
    target: xqt-shell
    paths: [qt/src/shell/]
    responsibility: >-
      The QML image providers (thumbnails, sketches, covers, hit pages, snippets, annotation pictures), their caches
      with one owner of their memory and one owner of their worker threads.
    key:
      - name: Thumbnails
        path: qt/src/shell/Thumbnails.h
        what: image://thumbnail (port of upstream's PreviewJob)
      - name: PageSketches
        path: qt/src/shell/PageSketches.h
        what: image://sketch and the canvas's stand-ins
      - name: DocumentCovers
        path: qt/src/shell/DocumentCovers.h
        what: image://cover, the cards of the library
      - name: ImageMemory
        path: qt/src/shell/ImageMemory.h
        what: the limits of all image caches
      - name: ImageWorkers
        path: qt/src/shell/ImageWorkers.h
        what: the threads of all image providers
      - name: AsyncImage
        path: qt/src/shell/AsyncImage.h
        what: the shared response, LRU cache and URL encoding
      - name: SessionRegistry
        path: qt/src/shell/SessionRegistry.h
        what: the open documents the providers draw from (only TabManager registers)
    docs: [qt/docs/architecture/image-caches.md]
  - id: shell-models
    name: Models and settings
    layer: shell
    kind: qt
    label: list and settings models
    target: xqt-shell
    paths: [qt/src/shell/]
    responsibility: >-
      The list models of one document (pages, outline, layers, annotations, versions) and the settings-like models
      (settings.xml's keys, shortcuts, the toolbox, palettes).
    key:
      - name: PagesModel
        path: qt/src/shell/PagesModel.h
        what: the pages of the current document
      - name: OutlineModel, LayersModel, AnnotationsModel, VersionsModel
        path: qt/src/shell/LayersModel.h
        what: per-document lists of the side panels
      - name: SettingsModel
        path: qt/src/shell/SettingsModel.h
        what: "upstream's settings.xml keys and the fork's (its xournalQt part)"
      - name: ToolboxModel
        path: qt/src/shell/ToolboxModel.h
        what: the toolbox rail and the top bar
      - name: ShortcutsModel
        path: qt/src/shell/ShortcutsModel.h
        what: the keyboard shortcuts
    docs: [qt/docs/features/toolbox.md, qt/docs/features/color-palettes.md]

  # --- Canvas and views ---------------------------------------------------------------------------------------------
  - id: quick
    name: quick
    layer: view
    kind: qt
    label: the canvas in the scene graph
    target: xqt-quick
    paths: [qt/src/quick/]
    responsibility: >-
      The bridge between a CanvasView and the Qt Quick scene graph: page tiles as scene graph nodes, an event filter
      that takes all canvas input, dark pages on the GPU, the window's size class.
    key:
      - name: DocumentCanvasItem
        path: qt/src/quick/DocumentCanvasItem.h
        what: the QQuickItem that shows one CanvasView (QML type DocumentCanvas)
      - name: DarkTileMaterial
        path: qt/src/quick/DarkTileMaterial.h
        what: dark pages on the GPU (shaders in shaders/)
      - name: AdaptiveLayout
        path: qt/src/quick/AdaptiveLayout.h
        what: the window's size class and touch profile (win.adaptive)
      - name: TouchGestures
        path: qt/src/quick/TouchGestures.h
        what: four- and five-finger gestures for the window
    docs: [qt/src/quick/README.md, qt/docs/decisions/0001-ui-host.md, qt/docs/features/dark-pages.md]
  - id: canvas
    name: canvas
    layer: view
    kind: qt
    label: a document in a view; input, tools
    target: xqt-canvas
    paths: [qt/src/canvas/]
    w: 1.6
    responsibility: >-
      A DocumentSession shown in a view: the visible pages and their rendering, the input on them (pen, touch,
      mouse, palm rejection), and the tools and editors that work on a page. Qt Gui, no Qt Quick.
    key:
      - name: CanvasView
        path: qt/src/canvas/CanvasView.h
        what: "a session in a view: visible pages, rendering, selection, clipboard, links; implements the shadows XournalView and Layout"
      - name: CanvasPage
        path: qt/src/canvas/CanvasPage.h
        what: one page in a view, the tools' dispatch; implements the shadow XojPageView (port of gui/PageView.cpp)
      - name: CanvasInput
        path: qt/src/canvas/CanvasInput.h
        what: pen, touch, mouse; palm rejection, gestures (port of upstream's input handlers)
      - name: DocumentLayout, ViewController
        path: qt/src/canvas/ViewController.h
        what: where pages lie; zoom and scroll (port of gui/Layout and ZoomControl)
      - name: CanvasMemory
        path: qt/src/canvas/CanvasMemory.h
        what: the memory for rendered pages, shared by every view
      - name: TextEditor, MarkdownEditor
        path: qt/src/canvas/MarkdownEditor.h
        what: typing on the page
      - name: StickyNotes, Snip, PenGestures, GeometryToolLayer
        path: qt/src/canvas/StickyNotes.h
        what: the fork's tools on the page
    docs: [qt/src/canvas/README.md, qt/docs/features/pen-gestures.md, qt/docs/features/sticky-notes.md]
  - id: hwr
    name: hwr
    layer: view
    kind: qt
    label: handwriting search
    target: xqt-hwr
    paths: [qt/src/hwr/]
    responsibility: >-
      Reads handwriting in the background (ONNX Runtime, loaded at run time) so the search finds it; the ink is
      never converted.
    key:
      - name: HandwritingSearch
        path: qt/src/hwr/HandwritingSearch.h
        what: the setting, the recognisers, the worker, an indexer per document
      - name: InkLayout
        path: qt/src/hwr/InkLayout.h
        what: a page's ink as lines and words
      - name: InkRecognitionService
        path: qt/src/hwr/InkRecognitionService.h
        what: the one worker thread at idle priority
      - name: OrtRuntime
        path: qt/src/hwr/OrtRuntime.h
        what: ONNX Runtime loaded at run time
    docs: [qt/src/hwr/README.md, qt/docs/features/handwriting-search.md]

  # --- Documents --------------------------------------------------------------------------------------------------
  - id: audio
    name: audio
    layer: document
    kind: qt
    label: recording and playing
    target: xqt-audio
    paths: [qt/src/audio/]
    responsibility: >-
      Records and plays Ogg Vorbis, compatible with Xournal++'s audio (a stroke tied to a moment of a recording).
    key:
      - name: Recorder, Player
        path: qt/src/audio/Recorder.h
        what: recording and playing
      - name: DocumentAudio
        path: qt/src/audio/DocumentAudio.h
        what: a document's recordings and the elements tied to them
      - name: OggVorbis
        path: qt/src/audio/OggVorbis.h
        what: Ogg Vorbis with the vendored libogg/libvorbis
    docs: [qt/src/audio/README.md, qt/docs/features/audio.md]
  - id: markdown
    name: markdown
    layer: document
    kind: qt
    label: Markdown engine
    target: xqt-markdown
    paths: [qt/src/markdown/]
    responsibility: >-
      Parses (md4c), lays out (Pango), paginates and draws (cairo) Markdown text, with the same text stack as
      upstream's text elements; registers the renderer upstream's TextView asks for Markdown texts.
    key:
      - name: MdDocument
        path: qt/src/markdown/MdDocument.h
        what: a parsed text as blocks of formatted runs
      - name: MdLayout
        path: qt/src/markdown/MdLayout.h
        what: laid out for a width, drawn with cairo
      - name: MdBox
        path: qt/src/markdown/MdBox.h
        what: Markdown boxes on pages; sets the hooks of model/MarkdownText.h
      - name: MdMath
        path: qt/src/markdown/MdMath.h
        what: formulas by MicroTeX
