flows:
  - id: tab
    name: A document becomes a tab
    steps:
      - block: qml-home
        file: qt/src/app/qml/Main.qml
        text: The reader picks a document on the home screen; the window calls app.openPath.
      - block: app-controller
        file: qt/src/app/AppController.cpp
        text: AppController::openPath shows the tab if the file is open already; otherwise it loads the file.
      - block: session
        file: qt/src/session/DocumentSession.cpp
        text: DocumentSession::loadFile reads it with upstream's LoadHandler (a PDF with notes through HybridPdf).
      - block: core-xojfile
        file: src/core/control/xojfile/LoadHandler.cpp
        text: LoadHandler parses the XML and builds the Document; the fork's xqt-* attributes go to the builder too.
      - block: shell-window
        file: qt/src/shell/TabManager.cpp
        text: TabManager adds a tab that owns the session and a CanvasView of it.
      - block: current-document
        file: qt/src/app/CurrentDocument.cpp
        text: CurrentDocument follows the new tab; the window's properties change once each.
      - block: quick
        file: qt/src/quick/DocumentCanvasItem.cpp
        text: The DocumentCanvas item in PageArea.qml shows the tab's CanvasView.
  - id: stroke
    name: A pen stroke
    steps:
      - block: quick
        file: qt/src/quick/DocumentCanvasItem.cpp
        text: The window's event filter in DocumentCanvasItem takes the tablet event inside the canvas.
      - block: canvas
        file: qt/src/canvas/CanvasInput.cpp
        text: CanvasInput tells pen from palm and gesture, filters the pressure and finds the page.
      - block: canvas
        file: qt/src/canvas/CanvasPage.cpp
        text: CanvasPage (upstream's XojPageView, ported) creates the tool's input handler.
      - block: core-tools
        file: src/core/control/tools/StrokeHandler.cpp
        text: Upstream's StrokeHandler builds the stroke and draws it in its overlay while the pen moves.
      - block: core-undo
        file: src/core/undo/InsertUndoAction.cpp
        text: On pen up the stroke goes into the layer and an InsertUndoAction onto the session's UndoRedoHandler.
      - block: session
        file: qt/src/session/DocumentSession.cpp
        text: The page's revision changes; the document is now modified, and autosave will save it.
  - id: page
    name: A page on screen
    steps:
      - block: canvas
        file: qt/src/canvas/CanvasView.cpp
        text: CanvasView works out the visible pages and asks for a raster of each at the current zoom.
      - block: render
        file: qt/src/render/RenderService.cpp
        text: RenderService gives the PageRaster to a worker thread; a raster is never rendered by two workers at once.
      - block: core-view
        file: src/core/view/DocumentView.cpp
        text: The worker draws the page with upstream's DocumentView under a shared lock of the document; the PDF background outside it.
      - block: quick
        file: qt/src/quick/DocumentCanvasItem.cpp
        text: DocumentCanvasItem turns the raster into tiles of the scene graph; CanvasMemory keeps the rendered pages within the setting.

tasks:
  - task: Save a new attribute in .xopp files
    qt: [qt/src/session/ElementTimes.h]
    upstream: [src/core/control/xojfile/XmlAttrs.h, src/core/control/xojfile/XmlParser.cpp, src/core/control/xojfile/DocumentBuilderInterface.h, src/core/control/xojfile/LoadHandler.cpp, src/core/control/xojfile/SaveHandler.cpp]
    note: A seam; record it in ADR 0002 (the attributes xqt-group and xqt-created are the pattern).
  - task: Change how the pen draws or a tool behaves
    qt: [qt/src/canvas/CanvasPage.cpp, qt/src/canvas/CanvasInput.cpp, qt/src/shell/ToolboxModel.h, qt/src/app/qml/Toolbox.qml]
    upstream: [src/core/control/tools/StrokeHandler.cpp, src/core/control/ToolHandler.h, src/core/view/overlays/StrokeToolView.cpp]
    note: Prefer the fork's side; an upstream tool changed is a seam.
  - task: Palm rejection, touch gestures, zoom and scroll
    qt: [qt/src/canvas/CanvasInput.cpp, qt/src/canvas/ViewController.h, qt/src/quick/DocumentCanvasItem.cpp, qt/src/quick/TouchGestures.h]
    upstream: [src/core/gui/inputdevices/]
    note: Upstream's input handlers are not built; the fork's are ports of them.
  - task: How a page is drawn (pixels)
    qt: [qt/src/render/PageRaster.cpp, qt/src/canvas/CanvasView.cpp, qt/src/quick/DocumentCanvasItem.cpp]
    upstream: [src/core/view/DocumentView.cpp, src/core/view/StrokeView.cpp, src/core/view/background/]
    note: The golden tests compare the CLI's pixels with upstream's.
  - task: Open, save, autosave a document
    qt: [qt/src/session/DocumentSession.cpp, qt/src/session/DocumentSaveTask.h, qt/src/session/FileIo.h]
    upstream: [src/core/control/xojfile/LoadHandler.cpp, src/core/control/xojfile/SaveHandler.cpp]
  - task: The PDF with notes, versions, encryption
    qt: [qt/src/session/HybridPdf.h, qt/src/session/IncrementalPdf.h, qt/src/session/PdfEncryption.h]
    upstream: [src/core/pdf/base/XojCairoPdfExport.cpp, src/core/model/Document.h]
  - task: Export (PDF, PNG) and the CLI
    qt: [qt/cli/main.cpp, qt/src/session/ArchivePdf.h]
    upstream: [src/core/pdf/base/XojPdfExportFactory.cpp, src/core/control/jobs/ImageExport.cpp, src/core/control/ExportHelper.cpp]
  - task: An undoable edit of the fork
    qt: [qt/src/session/PageOrderUndoAction.h]
    upstream: [src/core/undo/UndoAction.h, src/core/undo/UndoRedoHandler.h]
  - task: Markdown on the page
    qt: [qt/src/markdown/MdBox.cpp, qt/src/markdown/MdLayout.h, qt/src/canvas/MarkdownEditor.h]
    upstream: [src/core/model/MarkdownText.h, src/core/view/TextView.cpp, src/core/model/Text.cpp]
  - task: A new setting
    qt: [qt/src/shell/SettingsModel.cpp, qt/src/app/qml/SettingsPage.qml]
    upstream: [src/core/control/settings/Settings.h]
    note: "The fork's keys go into the custom part xournalQt of settings.xml; upstream's Settings stays as it is."
  - task: A button, menu entry or shortcut
    qt: [qt/src/app/qml/Toolbox.qml, qt/src/app/qml/WindowShortcuts.qml, qt/src/app/AppController.h, qt/src/shell/CanvasActions.h]
    upstream: []
  - task: The library, its index and search
    qt: [qt/src/shell/Library.h, qt/src/shell/LibraryIndex.h, qt/src/app/qml/HomeView.qml]
    upstream: []
  - task: Thumbnails and other pictures of pages
    qt: [qt/src/shell/Thumbnails.h, qt/src/shell/PageSketches.h, qt/src/shell/ImageMemory.h]
    upstream: [src/core/view/DocumentView.cpp]
    note: Every cache has an owner and a limit (image-caches.md).
  - task: Upstream code needs a GTK class or call (after an upstream merge)
    qt: [qt/compat/include/, qt/compat/gtkshim/, qt/cmake/XojSources.cmake, qt/tools/merge-upstream.sh]
    upstream: [src/core/]
    note: Extend the shadow or the shim; record it in ADR 0002.
