<script type="application/json" id="arch-data">{"github":"https://github.com/R-Fehler/xournal-qt","branch":"master-qt","intro":"xournal-qt is a fork of Xournal++: upstream's C++ core in `src/` (the document model, the .xopp/.xoj files, undo, the tools, the cairo renderers, PDF through poppler), compiled without GTK, under a new Qt 6 / Qt Quick frontend in `qt/`. Dependencies point down: the QML UI talks to the app's C++, which uses the shell, the canvas and the headless document session, which build on the Xournal++ core. Between the two sits `qt/compat`: headers with upstream's names that stand in for the GTK classes upstream's code expects.\nEach block below is a folder or a set of files with one job; most are one CMake target. Every edge says why it is there. The diagram shows the main edges; the tables and the interactive page show all of them.","layers":[{"id":"ui","name":"Qt Quick UI (QML)","about":"The whole user interface, in QML: one window per `Main.qml`, its parts each in a file of its own. QML talks to C++ only through the context properties `app` (an AppController) and `win`, the types registered under `XournalQt.Canvas`, the image providers and the list models."},{"id":"app","name":"App (C++ behind the UI)","about":"What the windows of the process share (AppServices), one window's QML API (AppController) and the program's start (main.cpp). Compiled into `xqt-shell` (the C++) and `xournal-qt` (main.cpp)."},{"id":"shell","name":"Shell (library, tabs, models)","about":"Everything between the documents and the QML that is not a canvas: the library, the tabs, what acts on a canvas, the image providers and their caches, the list and settings models. One target, `xqt-shell`."},{"id":"view","name":"Canvas and views","about":"A document shown in a view (canvas), the view in the Qt Quick scene graph (quick), and handwriting search (hwr), which reads the ink of the sessions."},{"id":"document","name":"Documents, headless","about":"One open document without a view (session), and what it builds on: the Markdown engine, recordings, and the Qt-free render workers. The CLI and the tests use these without a window."},{"id":"compat","name":"qt/compat (the GTK stand-ins)","about":"Headers with upstream's names placed before upstream's include paths, so upstream's files compile without GTK and without edits: shadows of the GTK application classes (implemented by the fork), a GTK type shim, and GTK-free implementations of a few upstream files."},{"id":"core","name":"Xournal++ core (src/, upstream)","about":"Upstream Xournal++'s C++ core, compiled unmodified (apart from the seams of ADR 0002) from the explicit list in `qt/cmake/XojSources.cmake` into three static libraries: `xoj-util`, `xoj-core` and `xoj-tools`. Upstream's GTK GUI is not built."},{"id":"around","name":"Around the app","about":"The headless CLI, the tests, the developer tools, the vendored libraries, the platform layers and CI."},{"id":"data","name":"Shared data","about":"The files both programs read and write. A document written by xournal-qt opens in Xournal++ and the other way round; the fork's own attributes are ones Xournal++ ignores."}],"blocks":[{"id":"qml-window","name":"Window","layer":"ui","kind":"qml","kindName":"QML UI","target":"xqt-ui","responsibility":"The window (`win`): its state objects (insets, view modes, chrome layout), its keys with the one ordered Esc/Back dispatcher, and the parts it instantiates.","paths":[{"path":"qt/src/app/qml/","url":"https://github.com/R-Fehler/xournal-qt/tree/master-qt/qt/src/app/qml"}],"key":[{"name":"Main.qml","what":"the window; holds the state objects and instantiates the parts","path":"qt/src/app/qml/Main.qml","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/app/qml/Main.qml"},{"name":"WindowInsets.qml, ViewModes.qml, ChromeLayout.qml","what":"safe areas and keyboard (win.insets), full screen, Zen, read only, presenting (win.modes), where the chrome goes (win.layout)","path":"qt/src/app/qml/ViewMo ainst the Qt-free core","minor":true},{"from":"upstream-tests","to":"render","kind":"links","what":"xoj-unit-tests links xoj-render: the fork's PageRasterTest and RegionRenderTest run in the same binary","minor":true},{"from":"tools","to":"core-gtk","kind":"calls","what":"XojSources.cmake lists what of src/ is built (GTK parts not)","minor":true},{"from":"android","to":"app-main","kind":"calls","what":"AndroidSetup before the core starts; the activity hosts the app","minor":true},{"from":"windows","to":"app-main","kind":"calls","what":"WindowsSetup, WindowsFonts before the core starts","minor":true},{"from":"linux","to":"app-main","kind":"calls","what":"installs the program with its desktop files and MIME types; the .deb","minor":true},{"from":"macos","to":"app-main","kind":"calls","what":"the app bundle around the program","minor":true},{"from":"ci","to":"linux","kind":"calls","what":"xqt-release.yml builds the packages; xqt-android, xqt-windows, xqt-macos the other platforms","minor":true},{"from":"ci","to":"tests","kind":"calls","what":"builds and runs the suite (xqt-build, xqt-block-tests)","minor":true}],"edgeKinds":[{"id":"links","about":"a CMake target links another","color":"#57606a"},{"id":"calls","about":"direct use: includes and calls","color":"#0969da"},{"id":"shadows","about":"through qt/compat's shadow headers","color":"#8250df"},{"id":"seam","about":"a hook or edit in an upstream file (ADR 0002)","color":"#d1570b"},{"id":"data","about":"reads or writes shared files","color":"#1a7f37"},{"id":"qml","about":"QML to C++: `app`, registered types, image providers, models","color":"#bf3989"}],"flows":[{"id":"tab","name":"A document becomes a tab","steps":[{"block":"qml-home","text":"The reader picks a document on the home screen; the window calls app.openPath.","file":"qt/src/app/qml/Main.qml","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/app/qml/Main.qml"},{"block":"app-controller","text":"AppController::openPath shows the tab if the file is open already; otherwise it loads the file.","file":"qt/src/app/AppController.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/app/AppController.cpp"},{"block":"session","text":"DocumentSession::loadFile reads it with upstream's LoadHandler (a PDF with notes through HybridPdf).","file":"qt/src/session/DocumentSession.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/session/DocumentSession.cpp"},{"block":"core-xojfile","text":"LoadHandler parses the XML and builds the Document; the fork's xqt-* attributes go to the builder too.","file":"src/core/control/xojfile/LoadHandler.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/src/core/control/xojfile/LoadHandler.cpp"},{"block":"shell-window","text":"TabManager adds a tab that owns the session and a CanvasView of it.","file":"qt/src/shell/TabManager.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/shell/TabManager.cpp"},{"block":"current-document","text":"CurrentDocument follows the new tab; the window's properties change once each.","file":"qt/src/app/CurrentDocument.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/app/CurrentDocument.cpp"},{"block":"quick","text":"The DocumentCanvas item in PageArea.qml shows the tab's CanvasView.","file":"qt/src/quick/DocumentCanvasItem.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/quick/DocumentCanvasItem.cpp"}]},{"id":"stroke","name":"A pen stroke","steps":[{"block":"quick","text":"The window's event filter in DocumentCanvasItem takes the tablet event inside the canvas.","file":"qt/src/quick/DocumentCanvasItem.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/quick/DocumentCanvasItem.cpp"},{"block":"canvas","text":"CanvasInput tells pen from palm and gesture, filters the pressure and finds the page.","file":"qt/src/canvas/CanvasInput.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/canvas/CanvasInput.cpp"},{"block":"canvas","text":"CanvasPage (upstream's XojPageView, ported) creates the tool's input handler.","file":"qt/src/canvas/CanvasPage.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/canvas/CanvasPage.cpp"},{"block":"core-tools","text":"Upstream's StrokeHandler builds the stroke and draws it in its overlay while the pen moves.","file":"src/core/control/tools/StrokeHandler.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/src/core/control/tools/StrokeHandler.cpp"},{"block":"core-undo","text":"On pen up the stroke goes into the layer and an InsertUndoAction onto the session's UndoRedoHandler.","file":"src/core/undo/InsertUndoAction.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/src/core/undo/InsertUndoAction.cpp"},{"block":"session","text":"The page's revision changes; the document is now modified, and autosave will save it.","file":"qt/src/session/DocumentSession.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/session/DocumentSession.cpp"}]},{"id":"page","name":"A page on screen","steps":[{"block":"canvas","text":"CanvasView works out the visible pages and asks for a raster of each at the current zoom.","file":"qt/src/canvas/CanvasView.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/canvas/CanvasView.cpp"},{"block":"render","text":"RenderService gives the PageRaster to a worker thread; a raster is never rendered by two workers at once.","file":"qt/src/render/RenderService.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/render/RenderService.cpp"},{"block":"core-view","text":"The worker draws the page with upstream's DocumentView under a shared lock of the document; the PDF background outside it.","file":"src/core/view/DocumentView.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/src/core/view/DocumentView.cpp"},{"block":"quick","text":"DocumentCanvasItem turns the raster into tiles of the scene graph; CanvasMemory keeps the rendered pages within the setting.","file":"qt/src/quick/DocumentCanvasItem.cpp","url":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/src/quick/DocumentCanvasItem.cpp"}]}],"readme":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/docs/architecture/README.md","yaml":"https://github.com/R-Fehler/xournal-qt/blob/master-qt/qt/docs/architecture/architecture.yaml"}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("arch-data").textContent);
  var svg = document.getElementById("arch");
  var panel = document.getElementById("panel");
  var byId = {};
  DATA.blocks.forEach(function (b) { byId[b.id] = b; });
  var layerName = {};
  DATA.layers.forEach(function (l) { layerName[l.id] = l.name; });
  var kindsOn = {};
  DATA.edgeKinds.forEach(function (k) { kindsOn[k.id] = true; });
  var showMinor = false, selected = null, flow = null;
  document.getElementById("readme-link").href = DATA.readme;
  document.getElementById("yaml-link").href = DATA.yaml;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function text(s) {  // YAML text: `code` spans, paragraphs
    return esc(s).replace(/`([^`]*)`/g, "<code>$1</code>").replace(/\n/g, "</p><p>");
  }
  function link(url, label) {
    return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + label + "</a>";
  }

  // the filters
  var filters = document.getElementById("filters");
  DATA.edgeKinds.forEach(function (k) {
    var l = document.createElement("label");
    l.title = k.about;
    l.innerHTML = '<input type="checkbox" checked data-kind="' + k.id + '"><span class="swatch" style="background:' +
      k.color + '"></span>' + esc(k.id);
    filters.appendChild(l);
  });
  var minor = document.createElement("label");
  minor.title = "Edges the static diagram leaves out (always shown for the selected block)";
  minor.innerHTML = '<input type="checkbox" id="minor-toggle"> all edges';
  filters.appendChild(minor);
  filters.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "minor-toggle") { showMinor = t.checked; }
    else if (t.dataset.kind) { kindsOn[t.dataset.kind] = t.checked; }
    update();
  });

  function update() {
    svg.classList.toggle("show-minor", showMinor);
    svg.classList.toggle("has-sel", !!selected);
    svg.classList.toggle("has-flow", !!flow);
    var near = {};
    svg.querySelectorAll(".edge").forEach(function (p) {
      var on = selected && (p.dataset.from === selected || p.dataset.to === selected);
      p.classList.toggle("off", !kindsOn[p.dataset.kind]);
      p.classList.toggle("on", !!on && kindsOn[p.dataset.kind]);
      if (on && kindsOn[p.dataset.kind]) { near[p.dataset.from] = near[p.dataset.to] = true; }
    });
    var steps = {};
    if (flow) { flow.steps.forEach(function (s) { steps[s.block] = true; }); }
    svg.querySelectorAll(".block").forEach(function (g) {
      g.classList.toggle("sel", g.dataset.id === selected);
      g.classList.toggle("nb", !!near[g.dataset.id]);
      g.classList.toggle("step", !!steps[g.dataset.id]);
    });
  }

  function edgeItem(e, other) {
    var b = byId[other];
    var kind = DATA.edgeKinds.filter(function (k) { return k.id === e.kind; })[0];
    return '<li><span class="chip kind" style="border-color:' + kind.color + '">' + esc(e.kind) + "</span>" +
      '<button class="linklike who" data-go="' + esc(other) + '">' + esc(b.name) + "</button>" +
      '<div class="muted">' + text(e.what) + "</div></li>";
  }

  function showBlock(id) {
    var b = byId[id];
    selected = id; flow = null;
    var outs = DATA.edges.filter(function (e) { return e.from === id; });
    var ins = DATA.edges.filter(function (e) { return e.to === id; });
    var h = '<span class="chip">' + esc(layerName[b.layer]) + '</span><span class="chip">' + esc(b.kindName) +
      "</span>" + "<h2>" + esc(b.name) + "</h2>";
    if (b.target) { h += '<div class="muted">CMake target <code>' + esc(b.target) + "</code></div>"; }
    h += "<p>" + text(b.responsibility) + "</p>";
    h += "<h3>Where</h3><ul>" + b.paths.map(function (p) {
      return "<li>" + link(p.url, "<code>" + esc(p.path) + "</code>") + "</li>";
    }).join("") + "</ul>";
    h += "<h3>Key classes and files</h3><ul>" + b.key.map(function (k) {
      return "<li>" + link(k.url, "<code>" + esc(k.name) + "</code>") + ' <span class="muted">' + text(k.what) +
        "</span></li>";
    }).join("") + "</ul>";
    if (b.docs.length) {
      h += "<h3>Docs</h3><ul>" + b.docs.map(function (d) {
        return "<li>" + link(d.url, esc(d.path.replace(/^qt\/docs\//, ""))) + "</li>";
      }).join("") + "</ul>";
    }
    if (outs.length) {
      h += '<h3>Depends on (' + outs.length + ')</h3><ul class="edge-list">' +
        outs.map(function (e) { return edgeItem(e, e.to); }).join("") + "</ul>";
    }
    if (ins.length) {
      h += '<h3>Used by (' + ins.length + ')</h3><ul class="edge-list">' +
        ins.map(function (e) { return edgeItem(e, e.from); }).join("") + "</ul>";
    }
    h += '<p style="margin-top:18px"><button class="linklike" data-home="1">← Overview</button></p>';
    panel.innerHTML = h;
    panel.scrollTop = 0;
    if (history.replaceState) { history.replaceState(null, "", "#" + id); }
    update();
  }

  function showFlow(f) {
    selected = null; flow = f;
    var h = '<span class="chip">Path through the code</span><h2>' + esc(f.name) + "</h2><ol>" +
      f.steps.map(function (s) {
        return '<li><button class="linklike who" data-go="' + esc(s.block) + '">' + esc(byId[s.block].name) +
          "</button>, " + link(s.url, "<code>" + esc(s.file.split("/").pop()) + "</code>") + ": " + text(s.text) +
          "</li>";
      }).join("") + "</ol>" + '<p><button class="linklike" data-home="1">← Overview</button></p>';
    panel.innerHTML = h;
    if (history.replaceState) { history.replaceState(null, "", "#flow-" + f.id); }
    update();
  }

  function showHome() {
    selected = null; flow = null;
    var h = "<h2>Overview</h2><p>" + text(DATA.intro) + "</p>" +
      '<p class="muted">Click a block for its responsibility, key files (on GitHub) and its edges; click an edge ' +
      "partner to follow it. The filters above hide kinds of edges; “all edges” also shows the ones the static " +
      "diagram leaves out.</p>";
    h += "<h3>Paths through the code</h3><ul>" + DATA.flows.map(function (f) {
      return '<li><button class="linklike" data-flow="' + esc(f.id) + '">' + esc(f.name) + "</button></li>";
    }).join("") + "</ul>";
    h += "<h3>Edges</h3><ul>" + DATA.edgeKinds.map(function (k) {
      return '<li><span class="chip kind" style="border-color:' + k.color + '">' + esc(k.id) + "</span>" + text(k.about) +
        "</li>";
    }).join("") + "</ul>";
    h += "<h3>Layers</h3><ul>" + DATA.layers.map(function (l) {
      return "<li><strong>" + esc(l.name) + "</strong>: " + text(l.about) + "</li>";
    }).join("") + "</ul>";
    panel.innerHTML = h;
    if (history.replaceState) { history.replaceState(null, "", location.pathname + location.search); }
    update();
  }

  svg.addEventListener("click", function (ev) {
    var g = ev.target.closest ? ev.target.closest(".block") : null;
    if (g) { showBlock(g.dataset.id); } else if (selected || flow) { showHome(); }
  });
  svg.addEventListener("keydown", function (ev) {
    var g = ev.target.closest ? ev.target.closest(".block") : null;
    if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); showBlock(g.dataset.id); }
  });
  panel.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-go],[data-home],[data-flow]") : null;
    if (!t) { return; }
    if (t.dataset.go) { showBlock(t.dataset.go); }
    else if (t.dataset.flow) { showFlow(DATA.flows.filter(function (f) { return f.id === t.dataset.flow; })[0]); }
    else { showHome(); }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { showHome(); } });

  var hash = decodeURIComponent(location.hash.slice(1));
  var startFlow = DATA.flows.filter(function (f) { return "flow-" + f.id === hash; })[0];
  if (byId[hash]) { showBlock(hash); } else if (startFlow) { showFlow(startFlow); } else { showHome(); }
})();
</script>
</body>
</html>
