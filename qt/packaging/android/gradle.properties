# xournal-qt: Gradle settings for the APK build (androiddeployqt adds the SDK/NDK/Qt keys to this file in the build
# folder). Kept small: the build machine is shared, so at most 4 workers and a 2 GB heap.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
